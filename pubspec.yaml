name: flutter_layered_architecture
version: 0.0.1
publish_to: "none"

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

workspace:
  - packages/annotations
  - example/app
  - example/foundation/dependency_injection
  - example/domain/todo
  - example/data/repository/todo
  - example/data/repository/todo/_impl
  - example/data/injection
  - example/usecase/todo
  - example/usecase/todo/_impl
  - example/usecase/injection
  - example/screen/feature/todo_list
  - example/infra/example_ignore

dev_dependencies:
  flutter_lints: ^6.0.0
