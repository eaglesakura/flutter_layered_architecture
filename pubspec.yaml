name: flutter_layered_architecture
version: 0.0.1
publish_to: "none"

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.50.0"

workspace:
  - packages/annotations
  - packages/lint
  - example/app
  - example/domain/todo
  - example/data/repository/todo
  - example/data/repository/todo/_impl
  - example/usecase/todo
  - example/usecase/todo/_impl
  - example/screen/feature/todo_list

dev_dependencies:
  flutter_lints: ^6.0.0
