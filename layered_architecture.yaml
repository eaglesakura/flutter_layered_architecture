# アーキテクチャレイヤー定義.
#
# 探索: 対象 package から親へ辿り、最初に見つかった本ファイルを適用する。
# 無ければ warning。path_prefix は本ファイル所在ディレクトリからの相対パス。
# 所属・依存先の実パスは package_config.json で解決し、path は separator 正規化して判定する。
# level は optional。未記載レイヤーは任意レイヤーと接続可。未使用レイヤー定義は将来予約として許可。
# 依存方向: 双方に level があるとき dep.level <= self.level（同レベル含む）。違反は warning。
# 重複 / path_prefix 包括も warning（事前チェック）。1 package の複数レイヤー所属は許可しない。
# 詳細は
# .apm/skills/flutter-layered-architecture-linter-rule-architecture-layer-dependency/SKILL.md
layers:
  # レイヤー名を定義
  - app:
      level: 7
      description: |
        Appレイヤー.
        アプリケーションのエントリーポイントを提供する.
      path_prefix: example/app
  - screen:
      level: 6
      description: |
        Screenレイヤー.
        ユーザーインターフェースを提供する.
      path_prefix: example/screen
  - view:
      level: 5
      description: |
        Viewレイヤー.
        ユーザーインターフェースを提供する.
      path_prefix: example/view
  - usecase:
      level: 4
      description: |
        Usecaseレイヤー.
        ビジネスロジックを提供する.
      path_prefix: example/usecase
  - data:
      level: 4
      description: |
        Dataレイヤー.
        データの取得や保存を提供する.
      path_prefix: example/data
  - infra:
      level: 3
      description: |
        Infrastructureレイヤー.
        外部APIやデータベースとの通信を提供する.
      path_prefix: example/infra
  - domain:
      level: 2
      description: |
        Domainレイヤー.
        ビジネスロジックを提供する.
      path_prefix: example/domain
  - foundation:
      level: 1
      description: |
        Foundationレイヤー.
        依存性注入や共通ユーティリティを提供する.
      path_prefix: example/foundation
  - testing:
      description: |
        Unit Testサポート用.
        任意のレイヤーに接続することができる.
      path_prefix: example/testing

rules:
  architecture_layer_dependency:
    # 特定packageのみ無視する
    ignore:
      - infra_example_ignore
  architecture_implementation_dependency:
    # 特定packageのみ _impl 依存検査をスキップする
    ignore:
      - infra_example_ignore
  public_type_file_name:
    # ファイル名の命名規則を定義
    # {キーワード}: {変換されるファイル名}
    # ClassName: classname
    keywords:
      UseCase: usecase
      ViewModel: viewmodel
