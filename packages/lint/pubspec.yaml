name: flutter_layered_architecture_lint
description: Analyzer plugin for Flutter Layered Architecture conventions.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  # Must be compatible with the analysis_server pin (^0.3.21 → 0.3.26 / analyzer 14.7.0).
  analysis_server_plugin: 0.3.26
  analyzer: 14.7.0
  flutter_layered_architecture_annotations:
    path: ../annotations
  meta: ^1.16.0
  path: ^1.9.0

dev_dependencies:
  flutter_lints: ^6.0.0
  lints: ^6.0.0
